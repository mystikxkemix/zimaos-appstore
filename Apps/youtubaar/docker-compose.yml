# Youtubaar: Sonarr-style watcher for YouTube channels and playlists.
# The image tag is bumped by .github/workflows/publish.yml when a new 1.N image is published.
name: youtubaar
services:
  app:
    container_name: youtubaar
    image: ghcr.io/mystikxkemix/youtubaar:2.21
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8085:8085"
    environment:
      DOWNLOADER: ytdlp
      POLL_INTERVAL_MINUTES: "30"
      YTDLP_CONCURRENCY: "1"
      AUTH_PASSWORD: ""
    volumes:
      - /DATA/AppData/$AppID/data:/data
      - /DATA/Media/YouTube:/downloads
x-casaos:
  id: io.github.mystikxkemix.youtubaar
  architectures:
    - amd64
  main: app
  author: mystikxkemix
  developer: mystikxkemix
  title:
    en_US: Youtubaar
  tagline:
    en_US: Sonarr for YouTube channels and playlists
  description:
    en_US: Follow YouTube channels and playlists, pick or auto-download new videos with yt-dlp, and save them as Jellyfin shows.
  icon: icon.svg
  version: "2.21.0"
  update_at: "2026-11-23"
  release_notes:
    en_US: |-
      Changes since 2.20:
      - Fix: Fetch the title again for videos first seen without one
      - New: Ignore private videos until they are public
      https://github.com/mystikxkemix/Youtubaar/compare/883b0da...5d343c0
  repo: https://github.com/mystikxkemix/Youtubaar
  category: Media
  port_map: "8085"
  scheme: http
  index: /
