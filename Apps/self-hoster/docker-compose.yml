# self-hoster: runs personal projects (services and static sites) cloned from git.
# The image tag is bumped by .github/workflows/publish.yml when a new 1.N image is published.
name: self-hoster
services:
  app:
    container_name: self-hoster
    image: ghcr.io/mystikxkemix/self-hoster:2.15
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: host
    environment:
      SELFHOSTER_ADDR: ":8090"
      SELFHOSTER_PORTS: "4000-4019"
      SELFHOSTER_ADMIN_PASSWORD: change-me
      SELFHOSTER_MCP_URL: ""
    volumes:
      - /DATA/AppData/$AppID/data:/data
      - /DATA/AppData/$AppID/apps:/apps
x-casaos:
  id: io.github.mystikxkemix.self-hoster
  architectures:
    - amd64
  main: app
  author: mystikxkemix
  developer: mystikxkemix
  title:
    en_US: SelfHoster
  tagline:
    en_US: Host your own projects from git
  description:
    en_US: Clones, builds and runs personal services and static websites, one port each, with an admin UI and an MCP endpoint.
  icon: icon.svg
  version: "2.15.0"
  update_at: "2026-11-22"
  release_notes:
    en_US: |-
      Changes since 1.18:
      - Maintenance only, no visible change.
      https://github.com/mystikxkemix/self-hoster/compare/e10f906...c3d6c8c
  repo: https://github.com/mystikxkemix/self-hoster
  category: Developer
  port_map: "8090"
  scheme: http
  index: /
