# self-hoster: runs personal projects (services and static sites) cloned from git.
# The image tag is bumped by .github/workflows/bump.yml when a new 1.N image is published.
name: self-hoster
services:
  app:
    container_name: self-hoster
    image: ghcr.io/mystikxkemix/self-hoster:1.18
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: host
    environment:
      SELFHOSTER_ADDR: ":8090"
      SELFHOSTER_PORTS: "4000-4019"
      SELFHOSTER_ADMIN_PASSWORD: change-me
      SELFHOSTER_MCP_URL: ""
    volumes:
      - /DATA/AppData/$AppID/data:/data
      - /DATA/AppData/$AppID/apps:/apps
    x-casaos:
      envs:
        - container: SELFHOSTER_ADMIN_PASSWORD
          description:
            en_US: First admin password (change it in Settings afterwards)
        - container: SELFHOSTER_PORTS
          description:
            en_US: Port range the hosted projects may use
        - container: SELFHOSTER_MCP_URL
          description:
            en_US: Public HTTPS URL for the Claude MCP endpoint (optional)
      volumes:
        - container: /data
          description:
            en_US: self-hoster state, checkouts and build caches
        - container: /apps
          description:
            en_US: Persistent data of each project
x-casaos:
  id: io.github.mystikxkemix.self-hoster
  architectures:
    - amd64
  main: app
  author: mystikxkemix
  developer: mystikxkemix
  title:
    en_US: SelfHoster
  tagline:
    en_US: Host your own projects from git
  description:
    en_US: Clones, builds and runs personal services and static websites, one port each, with an admin UI and an MCP endpoint.
  icon: https://cdn.jsdelivr.net/gh/mystikxkemix/zimaos-appstore@main/Apps/self-hoster/icon.svg
  thumbnail: ""
  category: Developer
  port_map: "8090"
  scheme: http
  index: /
