# Family app API: shared lists, watchlist, places and events for the Family iPhone app.
# Uses the MongoDB running on the ZimaOS host itself (no authentication), reached
# through host.docker.internal; change MONGODB_URI in the app settings otherwise.
# The first start writes a one-time setup code in the logs: the first account needs it.
# Push: put apns.json and the AuthKey_*.p8 files in /DATA/AppData/family-api/apns
# (see the repo README). Without them, push is off.
# Make it public only through HTTPS (reverse proxy or tunnel), never plain HTTP.
# The image tag is bumped by .github/workflows/publish.yml when a new 1.N image is published.
name: family-api
services:
  app:
    container_name: family-api
    image: ghcr.io/mystikxkemix/family-api:1.3
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8100:8080"
    # Lets the container reach the host (Linux needs this mapping).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MONGODB_URI: mongodb://host.docker.internal:27017
      MONGODB_DB: family-app
      SESSION_TTL_DAYS: "180"
      # Header with the real client IP when behind a proxy (X-Real-IP, CF-Connecting-IP...).
      CLIENT_IP_HEADER: ""
      APNS_CONFIG_FILE: /data/apns/apns.json
      # Optional media tools: leave empty to turn them off.
      RADARR_URL: ""
      RADARR_API_KEY: ""
      SONARR_URL: ""
      SONARR_API_KEY: ""
      PROWLARR_URL: ""
      PROWLARR_API_KEY: ""
    volumes:
      - /DATA/AppData/$AppID/apns:/data/apns:ro
x-casaos:
  id: io.github.mystikxkemix.family-api
  architectures:
    - amd64
  main: app
  author: mystikxkemix
  developer: mystikxkemix
  title:
    en_US: Family API
  tagline:
    en_US: Shared lists, watchlist, places and events
  description:
    en_US: Backend of the Family iPhone app. Grocery and to-do lists, a movie and TV watchlist (with optional Radarr, Sonarr and Prowlarr), places to try and events, shared in a household, with push notifications. Needs a MongoDB.
  icon: icon.svg
  version: "1.3.0"
  repo: https://github.com/mystikxkemix/family-app
  category: Utilities
  port_map: "8100"
  scheme: http
  index: /healthz
