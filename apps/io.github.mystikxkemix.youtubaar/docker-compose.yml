# Youtubaar: Sonarr-style watcher for YouTube channels and playlists.
# The image tag is bumped by .github/workflows/publish.yml when a new 1.N image is published.
name: youtubaar
services:
  app:
    container_name: youtubaar
    image: ghcr.io/mystikxkemix/youtubaar:2.21
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8085:8085"
    environment:
      DOWNLOADER: ytdlp
      POLL_INTERVAL_MINUTES: "30"
      YTDLP_CONCURRENCY: "1"
      AUTH_PASSWORD: ""
    volumes:
      - /DATA/AppData/$AppID/data:/data
      - /DATA/Media/YouTube:/downloads
x-casaos:
  id: io.github.mystikxkemix.youtubaar
  main: app
  title:
    en_US: Youtubaar
  icon: https://mystikxkemix.github.io/zimaos-appstore/apps/io.github.mystikxkemix.youtubaar/assets/icon.svg
  version: "2.21.0"
  port_map: "8085"
  scheme: http
  index: /
